<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-label="Proyectos: Gestor de Eventos, App Star Wars y Gestión de instrumentos">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#a371f7"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3fb950"/><stop offset="1" stop-color="#58a6ff"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f0883e"/><stop offset="1" stop-color="#f778ba"/></linearGradient>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    .t { font-size: 19px; font-weight: 700; fill: #f0f6fc; }
    .d { font-size: 14px; fill: #8b949e; }
    .p { font-size: 12px; font-weight: 600; }
    .k { font-size: 11px; font-weight: 700; letter-spacing: 2px; fill: #6e7681; }
  </style>
  <rect width="1000" height="250" fill="#0d1117"/>

  <!-- tarjeta 1 -->
  <g transform="translate(2 10)">
    <rect width="316" height="228" rx="14" fill="#161b22" stroke="#30363d"/>
    <rect x="16" y="0" width="284" height="2.5" rx="1.25" fill="url(#g1)"/>
    <text x="24" y="42" class="sans k">01 · EN EQUIPO</text>
    <text x="24" y="74" class="sans t">Gestor de Eventos</text>
    <text x="24" y="106" class="sans d">Aplicación full-stack desarrollada</text>
    <text x="24" y="127" class="sans d">por tres personas. Monté la</text>
    <text x="24" y="148" class="sans d">estructura MVC y la API REST.</text>
    <g class="sans p">
      <rect x="24" y="182" width="50" height="24" rx="12" fill="#58a6ff" fill-opacity="0.12"/><text x="49" y="198" text-anchor="middle" fill="#79c0ff">Java</text>
      <rect x="82" y="182" width="96" height="24" rx="12" fill="#a371f7" fill-opacity="0.12"/><text x="130" y="198" text-anchor="middle" fill="#d2a8ff">Spring Boot</text>
      <rect x="186" y="182" width="60" height="24" rx="12" fill="#58a6ff" fill-opacity="0.12"/><text x="216" y="198" text-anchor="middle" fill="#79c0ff">REST</text>
    </g>
  </g>

  <!-- tarjeta 2 -->
  <g transform="translate(342 10)">
    <rect width="316" height="228" rx="14" fill="#161b22" stroke="#30363d"/>
    <rect x="16" y="0" width="284" height="2.5" rx="1.25" fill="url(#g2)"/>
    <text x="24" y="42" class="sans k">02 · WEB APP</text>
    <text x="24" y="74" class="sans t">App Star Wars</text>
    <text x="24" y="106" class="sans d">Aplicación web con arquitectura</text>
    <text x="24" y="127" class="sans d">MVC: controladores, modelos,</text>
    <text x="24" y="148" class="sans d">rutas, servicios y vistas.</text>
    <g class="sans p">
      <rect x="24" y="182" width="70" height="24" rx="12" fill="#3fb950" fill-opacity="0.12"/><text x="59" y="198" text-anchor="middle" fill="#56d364">Node.js</text>
      <rect x="102" y="182" width="72" height="24" rx="12" fill="#58a6ff" fill-opacity="0.12"/><text x="138" y="198" text-anchor="middle" fill="#79c0ff">Express</text>
      <rect x="182" y="182" width="48" height="24" rx="12" fill="#3fb950" fill-opacity="0.12"/><text x="206" y="198" text-anchor="middle" fill="#56d364">EJS</text>
    </g>
  </g>

  <!-- tarjeta 3 -->
  <g transform="translate(682 10)">
    <rect width="316" height="228" rx="14" fill="#161b22" stroke="#30363d"/>
    <rect x="16" y="0" width="284" height="2.5" rx="1.25" fill="url(#g3)"/>
    <text x="24" y="42" class="sans k">03 · CRUD</text>
    <text x="24" y="74" class="sans t">Gestión de instrumentos</text>
    <text x="24" y="106" class="sans d">Alta, consulta, edición y borrado</text>
    <text x="24" y="127" class="sans d">de registros contra base de</text>
    <text x="24" y="148" class="sans d">datos con Spring Boot.</text>
    <g class="sans p">
      <rect x="24" y="182" width="50" height="24" rx="12" fill="#f0883e" fill-opacity="0.12"/><text x="49" y="198" text-anchor="middle" fill="#ffa657">Java</text>
      <rect x="82" y="182" width="96" height="24" rx="12" fill="#f778ba" fill-opacity="0.12"/><text x="130" y="198" text-anchor="middle" fill="#ff9bce">Spring Boot</text>
      <rect x="186" y="182" width="60" height="24" rx="12" fill="#f0883e" fill-opacity="0.12"/><text x="216" y="198" text-anchor="middle" fill="#ffa657">CRUD</text>
    </g>
  </g>
</svg>
